name: Install Taste Skill

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check installation
        id: check
        shell: bash
        run: |
          if [ -f .opencode/skills/design-taste-frontend/SKILL.md ]; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Taste Skill for OpenCode
        if: steps.check.outputs.installed == 'false'
        run: npx skills add https://github.com/Leonxlnx/taste-skill --skill "design-taste-frontend" --agent opencode --copy -y

      - name: Commit installed skill
        if: steps.check.outputs.installed == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .opencode/skills/design-taste-frontend
          if git diff --cached --quiet; then
            echo "Taste Skill installer produced no files."
            exit 1
          fi
          git commit -m "chore: install taste-skill for blog frontend"
          git push
