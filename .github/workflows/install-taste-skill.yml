name: Install Taste Skill

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check installation
        id: check
        shell: bash
        run: |
          if [ -f .opencode/skills/design-taste-frontend/SKILL.md ]; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Taste Skill for OpenCode
        if: steps.check.outputs.installed == 'false'
        shell: bash
        run: |
          mkdir -p .opencode/skills/design-taste-frontend
          curl -fsSL https://raw.githubusercontent.com/Leonxlnx/taste-skill/main/skills/taste-skill/SKILL.md \
            -o .opencode/skills/design-taste-frontend/SKILL.md
          test -s .opencode/skills/design-taste-frontend/SKILL.md

      - name: Commit installed skill
        if: steps.check.outputs.installed == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .opencode/skills/design-taste-frontend/SKILL.md
          git commit -m "chore: install taste-skill for blog frontend"
          git push
