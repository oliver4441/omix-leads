name: Migrate Phikila to Decimal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'Migrate Phikila to Decimal') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace references
        shell: bash
        run: |
          set -euo pipefail
          files=$(git grep -Il -i 'phikila' -- ':!.github/workflows/rename-phikila-to-decimal.yml' || true)
          if [ -n "$files" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              sed -i \
                -e 's#https://www\.phikila\.com#https://decimal.omixsystems.store#g' \
                -e 's#https://phikila\.com#https://decimal.omixsystems.store#g' \
                -e 's#http://www\.phikila\.com#https://decimal.omixsystems.store#g' \
                -e 's#http://phikila\.com#https://decimal.omixsystems.store#g' \
                -e 's#Phikila#Decimal#g' \
                -e 's#PHIKILA#DECIMAL#g' \
                -e 's#phikila#decimal#g' "$file"
            done <<< "$files"
          fi
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Migrate Phikila to Decimal'
          git push
